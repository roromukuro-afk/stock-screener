name: research forecast tests

on:
  pull_request:
    paths:
      - "backend/app/models/research_forecast.py"
      - "backend/app/services/research_forecast.py"
      - "backend/app/routers/research_forecast.py"
      - "backend/app/main.py"
      - "backend/tests/test_research_forecast.py"
      - ".github/workflows/research-forecast-*.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            backend/app/models/research_forecast.py \
            backend/app/services/research_forecast.py \
            backend/app/routers/research_forecast.py \
            backend/app/main.py \
            backend/tests/test_research_forecast.py
      - name: Run verifier unit tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:////tmp/research_forecast_test.db
          SAMPLE_MODE: "true"
        run: python -m unittest discover -s backend/tests -p "test_research_forecast.py" -v
